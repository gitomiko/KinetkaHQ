<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kinetika HQ</title>
    <meta
      name="description"
      content="Kinetika HQ portal template for internal tool launch and navigation."
    />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=20260412i" />
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico?v=20260412i" />
    <link rel="shortcut icon" href="assets/favicon.ico?v=20260412i" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f5f1eb"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#1c1c1b"
    />
    <link rel="stylesheet" href="styles.css?v=20260412i" />
    <script defer src="app.js?v=20260412i"></script>
  </head>
  <body>
    <main class="shell">
      <header class="chrome chrome-top">
        <span class="chrome-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="chrome-brand" id="topBrand">kinetika hq · portal</span>
        <span class="chrome-right">
          <span class="chrome-status"><i class="dot dot-live"></i><span id="liveCount">0</span> live</span>
          <span id="clock" class="chrome-clock">--:--:--</span>
          <span id="hostLabel" class="chrome-host"></span>
          <button id="themeToggle" class="chrome-toggle" type="button">// dark</button>
        </span>
      </header>

      <aside class="sidebar">
        <div class="brand">
          <p class="brand-name" id="titleText">Kinetika HQ</p>
          <p class="brand-eyebrow" id="eyebrowText">KINETIKA CONTROL PLANE</p>
          <div class="brand-rule"></div>
        </div>

        <nav class="nav">
          <p class="nav-label">SECTIONS</p>
          <ul id="navList" class="nav-list" role="tablist"></ul>
        </nav>

        <label class="nav-search" for="searchInput">
          <input
            id="searchInput"
            type="search"
            autocomplete="off"
            placeholder="$ search..."
          />
        </label>
      </aside>

      <section class="panel" aria-live="polite">
        <p class="panel-eyebrow" id="panelEyebrow">SECTION</p>
        <h2 class="panel-title" id="panelTitle">—</h2>
        <p class="panel-note" id="panelNote"></p>
        <div id="tiles" class="tiles"></div>
      </section>

      <footer class="chrome chrome-bot">
        <span class="chrome-left">
          <i class="dot dot-live"></i>
          <span>live</span>
          <span class="chrome-sep">·</span>
          <span id="modePill">HQ Portal</span>
        </span>
        <span id="footerVersion" class="chrome-right-text">kinetika hq v1.0</span>
      </footer>
    </main>
  </body>
</html>
